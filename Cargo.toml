[package]
name = "rdreh"
version = "2.0.0"
edition = "2024"
description = "rdreh (command: rdr): keyboard-first terminal multiplexer for running and tracking AI coding agents"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui", "agents", "pty"]
categories = ["command-line-utilities"]

# The crate is `rdreh` (the name `rdr` is taken on crates.io); the command is `rdr`.
[[bin]]
name = "rdr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = { version = "0.29.0", features = ["event-stream", "serde"] }
dirs = "7.0.0"
futures = "0.3.34"
libc = "0.2.191"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
vt100 = "0.18.1"
zbus = { version = "6.2.0", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
