<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark slate canvas background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>

    <!-- Radar sweep gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft glow for active signals -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Tile (Squircle / Rounded Container) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Radar Concentric Range Rings -->
  <g fill="none" stroke="#1e293b" stroke-width="2.5">
    <circle cx="256" cy="256" r="190" stroke-opacity="0.4" />
    <circle cx="256" cy="256" r="135" stroke-dasharray="6 6" stroke-opacity="0.6" />
    <circle cx="256" cy="256" r="75" stroke-opacity="0.5" />
  </g>

  <!-- Top-Right Radar Active Sweep Cone (P1 / Top-Right focus) -->
  <path d="M 256 256 L 391 121 A 190 190 0 0 0 256 66 Z" fill="url(#sweepGrad)" />
  <line x1="256" y1="256" x2="390" y2="122" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" filter="url(#subtleGlow)" />

  <!-- Subtle Quadrant Tiling Dividers -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />

  <!-- 2x2 Pane Cockpit Brackets -->
  <!-- Top-Left (Q1: H) -->
  <path d="M 100 130 L 100 100 L 130 100" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 230 100 L 236 100" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  
  <!-- Top-Right (Q2: Active focus / Streaming) -->
  <path d="M 382 100 L 412 100 L 412 130" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />
  <path d="M 282 100 L 312 100" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Bottom-Left (Q3: J) -->
  <path d="M 100 382 L 100 412 L 130 412" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom-Right (Q4: L) -->
  <path d="M 412 382 L 412 412 L 382 412" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Agent Telemetry Nodes / Blips -->
  <!-- Pane 0 (Top-Left): Busy / Thinking -->
  <circle cx="160" cy="170" r="7" fill="#f59e0b" filter="url(#neonGlow)" />

  <!-- Pane 1 (Top-Right): Streaming / Active Sweep Target -->
  <circle cx="345" cy="155" r="9" fill="#10b981" filter="url(#neonGlow)" />
  <circle cx="345" cy="155" r="17" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.5" />

  <!-- Pane 2 (Bottom-Left): Blocked / Awaiting Input -->
  <circle cx="175" cy="335" r="7" fill="#ef4444" filter="url(#neonGlow)" />

  <!-- Pane 3 (Bottom-Right): Idle / Done -->
  <circle cx="335" cy="335" r="7" fill="#38bdf8" filter="url(#neonGlow)" />

  <!-- Central Neovim Crosshair Navigation Indicator -->
  <circle cx="256" cy="256" r="14" fill="#0b0f17" stroke="#38bdf8" stroke-width="3" filter="url(#subtleGlow)" />
  <circle cx="256" cy="256" r="4" fill="#38bdf8" />

  <!-- Minimal Modal Navigation Markers (H, J, K, L) -->
  <g font-family="ui-monospace, &#39;JetBrains Mono&#39;, &#39;Fira Code&#39;, monospace" font-size="20" font-weight="700" fill="#64748b" text-anchor="middle" dominant-baseline="central">
    <text x="216" y="256">h</text>
    <text x="256" y="296">j</text>
    <text x="256" y="216">k</text>
    <text x="296" y="256">l</text>
  </g>
</svg>